# =============================================================================
# Railway Deploy via GitHub Actions (Opcional)
# =============================================================================
# Este workflow se ejecuta AUTOMÁTICAMENTE cuando haces push a main.
# Despliega todos los servicios en Railway usando el CLI.
#
# REQUISITOS:
# 1. Añade el secret RAILWAY_TOKEN en GitHub → Settings → Secrets → Actions
#    Obtén el token: railway login → railway profile → "Create Token"
# 2. Opcional: añade RAILWAY_PROJECT_ID si quieres forzar un proyecto específico
#
# NOTA: Este workflow es OPCIONAL. Si usas GitHub Integration nativa de Railway,
# no necesitas este archivo. Railway detecta automáticamente los cambios en GitHub.
# Este workflow es útil si quieres más control (ej: desplegar solo ciertos servicios
# basado en qué archivos cambiaron).
# =============================================================================

name: 🚂 Deploy to Railway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  # =============================================================================
  # DETECT CHANGES — Identifica qué servicios cambiaron
  # =============================================================================
  detect-changes:
    name: 🔍 Detect Changed Services
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    outputs:
      auth-service: ${{ steps.changes.outputs.auth-service }}
      appointment-service: ${{ steps.changes.outputs.appointment-service }}
      clinical-service: ${{ steps.changes.outputs.clinical-service }}
      file-service: ${{ steps.changes.outputs.file-service }}
      ocr-service: ${{ steps.changes.outputs.ocr-service }}
      api-gateway: ${{ steps.changes.outputs.api-gateway }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🕵️ Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            auth-service:
              - 'services/auth-service/**'
              - 'packages/shared-*/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            appointment-service:
              - 'services/appointment-service/**'
              - 'packages/shared-*/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            clinical-service:
              - 'services/clinical-service/**'
              - 'packages/shared-*/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            file-service:
              - 'services/file-service/**'
              - 'packages/shared-*/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            ocr-service:
              - 'services/ocr-service/**'
              - 'packages/shared-*/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            api-gateway:
              - 'services/api-gateway/**'
              - 'packages/shared-*/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            frontend:
              - 'frontend/**'
              - 'packages/date-utils/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'

  # =============================================================================
  # BUILD & DEPLOY AUTH-SERVICE
  # =============================================================================
  deploy-auth-service:
    name: 🔐 Deploy Auth Service
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.auth-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚂 Deploy to Railway
        uses: berviantoleo/actions-railway@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: "auth-service"

  # =============================================================================
  # BUILD & DEPLOY APPOINTMENT-SERVICE
  # =============================================================================
  deploy-appointment-service:
    name: 📅 Deploy Appointment Service
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.appointment-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚂 Deploy to Railway
        uses: berviantoleo/actions-railway@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: "appointment-service"

  # =============================================================================
  # BUILD & DEPLOY CLINICAL-SERVICE
  # =============================================================================
  deploy-clinical-service:
    name: 🏥 Deploy Clinical Service
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.clinical-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚂 Deploy to Railway
        uses: berviantoleo/actions-railway@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: "clinical-service"

  # =============================================================================
  # BUILD & DEPLOY FILE-SERVICE
  # =============================================================================
  deploy-file-service:
    name: 📁 Deploy File Service
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.file-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚂 Deploy to Railway
        uses: berviantoleo/actions-railway@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: "file-service"

  # =============================================================================
  # BUILD & DEPLOY OCR-SERVICE
  # =============================================================================
  deploy-ocr-service:
    name: 🔍 Deploy OCR Service
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ocr-service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚂 Deploy to Railway
        uses: berviantoleo/actions-railway@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: "ocr-service"

  # =============================================================================
  # BUILD & DEPLOY API-GATEWAY
  # =============================================================================
  deploy-api-gateway:
    name: 🚪 Deploy API Gateway
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.api-gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚂 Deploy to Railway
        uses: berviantoleo/actions-railway@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: "api-gateway"

  # =============================================================================
  # BUILD & DEPLOY FRONTEND
  # =============================================================================
  deploy-frontend:
    name: 🎨 Deploy Frontend
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🚂 Deploy to Railway
        uses: berviantoleo/actions-railway@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: "frontend"

  # =============================================================================
  # NOTIFICATION (Opcional)
  # =============================================================================
  notify:
    name: 📢 Notify Completion
    needs: 
      - deploy-auth-service
      - deploy-appointment-service
      - deploy-clinical-service
      - deploy-file-service
      - deploy-ocr-service
      - deploy-api-gateway
      - deploy-frontend
    if: always() && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Notify Success
        if: ${{ !contains(needs.*.result, 'failure') }}
        run: echo "🎉 All services deployed successfully!"
        
      - name: ❌ Notify Failure
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          echo "❌ Some services failed to deploy"
          exit 1

  # =============================================================================
  # SELENIUM USABILITY TESTS — Corre pruebas de rendimiento en PRs a develop
  # =============================================================================
  test-selenium-usability:
    name: 🧪 Run Selenium Usability Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'develop'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: 🐘 Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: ⚙️ Setup CI Environment Variables
        run: ./scripts/setup-ci-env.sh

      - name: 🗄️ Setup Database Schema
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d postgres -f scripts/database-schema-completo.sql

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🛠️ Generate Prisma Clients
        run: pnpm prisma:generate:all

      - name: 🌱 Seed Database
        run: |
          pnpm --filter auth-service seed
          pnpm --filter appointment-service seed

      - name: 🚀 Start Services and Run E2E Selenium Tests
        run: |
          pnpm dev:services &
          pnpm dev:frontend &
          npx wait-on tcp:8080 tcp:3100 --timeout 60000
          node scripts/seed-demo.js
          pnpm test:selenium

